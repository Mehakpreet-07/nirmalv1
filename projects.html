<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project experience for Master Craftsman Construction Ltd. in commercial, multifamily and residential construction." />
  <title>Projects | Master Craftsman Construction Ltd.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="projects">
  <div id="site-header"></div>

  <main>
    <section class="page-hero page-hero--projects">
      <div class="container reveal">
        <p class="eyebrow eyebrow--light">Construction experience</p>
        <h1>Projects shaped by planning, coordination and field leadership.</h1>
        <p>Browse selected commercial, multifamily and residential project experience.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters reveal" role="tablist" aria-label="Project categories">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="commercial" type="button">Commercial</button>
          <button class="filter-btn" data-filter="multifamily" type="button">Multifamily</button>
          <button class="filter-btn" data-filter="residential" type="button">Residential</button>
        </div>

        <div id="project-grid" class="project-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <div class="modal" id="project-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog">
      <button class="modal__close" type="button" aria-label="Close project details" data-close-modal>×</button>
      <div class="modal__image-wrap">
        <img id="modal-image" class="modal__image" src="" alt="">
        <button class="gallery-btn gallery-btn--prev" type="button" aria-label="Previous image" id="gallery-prev">‹</button>
        <button class="gallery-btn gallery-btn--next" type="button" aria-label="Next image" id="gallery-next">›</button>
      </div>
      <div class="modal__content">
        <p id="modal-category" class="eyebrow"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-location" class="modal__location"></p>
        <div id="modal-meta" class="modal__meta"></div>
        <p id="modal-description"></p>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
